apiVersion: testbench.agentic-layer.ai/v1alpha1
kind: Experiment
metadata:
  name: cloudland-talks-experiment
  namespace: <your-namespace>
spec:
  agentRef:
    name: cloudland-talks-agent
    namespace: <your-namespace>
  aiGatewayRef:
    name: ai-gateway
    namespace: ai-gateway
  trigger:
    enabled: true
  dataset:
    inline:
      llmAsAJudgeModel: "gemini-2.5-flash-lite"
      defaultThreshold: 0.9
      scenarios:
        - name: "Find a specific talk by title"
          steps:
            - input: "Tell me about the 'Hands-on with the Agentic Layer' talk."
              reference:
                toolCalls:
                  - name: search_talks
                    args:
                      query: "Hands-on with the Agentic Layer"
                topics:
                  - cloudland-talk
              metrics:
                - metricName: AgentGoalAccuracyWithoutReference
                - metricName: ToolCallAccuracy
                - metricName: TopicAdherence
                  parameters:
                    mode: precision
        - name: "Recommend AI talks"
          steps:
            - input: "What AI talks are on the agenda?"
              reference:
                toolCalls:
                  - name: get_talks_by_focus
                    args:
                      focus: "AI"
                topics:
                  - cloudland-talk
              metrics:
                - metricName: AgentGoalAccuracyWithoutReference
                - metricName: ToolCallAccuracy
                - metricName: TopicAdherence
                  parameters:
                    mode: precision
        - name: "Off-topic request"
          steps:
            - input: "What's the weather like in Berlin right now?"
              reference:
                topics:
                  - cloudland-talk
              metrics:
                - metricName: AgentGoalAccuracyWithoutReference
                - metricName: TopicAdherence
                  parameters:
                    mode: precision
