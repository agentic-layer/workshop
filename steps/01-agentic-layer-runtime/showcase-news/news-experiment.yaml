apiVersion: testbench.agentic-layer.ai/v1alpha1
kind: Experiment
metadata:
  name: news-experiment
  namespace: <your-namespace>
spec:
  agentRef:
    name: news-agent
    namespace: <your-namespace>
  aiGatewayRef:
    name: ai-gateway
    namespace: ai-gateway
  env:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      valueFrom:
        configMapKeyRef:
          name: otel-config
          key: OTEL_EXPORTER_OTLP_ENDPOINT
  trigger:
    enabled: true
  dataset:
    inline:
      llmAsAJudgeModel: "gemini-2.5-flash-lite"
      defaultThreshold: 0.9
      scenarios:
        - name: "Fetch latest news"
          steps:
            - input: "What are the latest news headlines?"
              reference:
                toolCalls:
                  - name: fetch_article_titles_and_urls
                    args: {}
                topics:
                  - news
              metrics:
                - metricName: AgentGoalAccuracyWithoutReference
                - metricName: ToolCallAccuracy
                - metricName: TopicAdherence
                  parameters:
                    mode: precision
        - name: "Off-topic request"
          steps:
            - input: "What's the weather like in Berlin right now?"
              reference:
                topics:
                  - news
              metrics:
                - metricName: AgentGoalAccuracyWithoutReference
                - metricName: TopicAdherence
                  parameters:
                    mode: precision
